# satori:recommended v2 python/pip prefs: formatter=ruff
settings:
  name: Quality checks (python/pip)
  image: python:3.12-slim
install:
- python -m venv .venv
- .venv/bin/pip install .
- .venv/bin/pip install pytest
- .venv/bin/pip install ruff==0.17.0
- .venv/bin/pip install pyrefly==1.3.2
- .venv/bin/pip install pyspector==0.2.2
lint:
  ruff_check:
    setSeverity: 2
    run:
    - .venv/bin/ruff check --output-format=json .
format:
  ruff_format:
    setSeverity: 1
    run:
    - .venv/bin/ruff format --check .
types:
  pyrefly:
    setSeverity: 2
    run:
    - .venv/bin/pyrefly check
unit:
  pytest:
    assertReturnCode: 0
    setSeverity: 3
    run:
    - .venv/bin/pytest -q
security:
  pyspector:
    setSeverity: 4
    run:
    - .venv/bin/pyspector scan . -f json
